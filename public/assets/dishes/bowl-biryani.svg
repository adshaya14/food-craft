<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadowBir" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d2a1f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadowBir)">
    <!-- Traditional Clay Handi / Bowl -->
    <ellipse cx="100" cy="172" rx="72" ry="14" fill="#e2d7bc" opacity="0.6"/>
    <!-- Clay Bowl Base -->
    <path d="M30,105 C30,165 170,165 170,105 Z" fill="#9c4221"/>
    <path d="M34,105 C34,160 166,160 166,105 Z" fill="#c05621"/>
    <!-- Bowl Rim -->
    <ellipse cx="100" cy="105" rx="70" ry="18" fill="#dd6b20"/>
    <ellipse cx="100" cy="104" rx="66" ry="15" fill="#7b341e"/>
    <!-- Steaming Fragrant Rice Mound (Saffron & White Basmati) -->
    <ellipse cx="100" cy="100" rx="64" ry="24" fill="#faf089"/>
    <path d="M38,98 Q100,55 162,98 Q100,120 38,98 Z" fill="#feebc8"/>
    <!-- Saffron Infused Orange Streaks -->
    <path d="M55,90 Q90,75 140,88" stroke="#dd6b20" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M70,98 Q110,85 130,102" stroke="#d69e2e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Caramelized Fried Onions (Birista) -->
    <path d="M75,80 Q90,70 110,78" stroke="#4a1515" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M85,88 Q105,78 125,85" stroke="#4a1515" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Juicy Spiced Meat Pieces peaking through -->
    <rect x="75" y="85" width="22" height="16" rx="6" fill="#742a2a"/>
    <rect x="110" y="80" width="20" height="14" rx="5" fill="#742a2a"/>
    <!-- Boiled Egg Half -->
    <ellipse cx="100" cy="72" rx="14" ry="11" fill="#fffaf0"/>
    <ellipse cx="100" cy="72" rx="8" ry="7" fill="#ecc94b"/>
    <!-- Fresh Mint & Coriander leaves -->
    <circle cx="86" cy="76" r="4" fill="#38a169"/>
    <circle cx="116" cy="74" r="3.5" fill="#38a169"/>
    <!-- Steam wisps -->
    <path d="M80,50 Q75,35 82,25" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M100,45 Q105,30 98,20" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M120,48 Q115,35 122,25" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>