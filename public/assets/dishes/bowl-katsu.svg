<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shKat" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1d2a1f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shKat)">
    <ellipse cx="100" cy="172" rx="72" ry="14" fill="#e2d7bc" opacity="0.6"/>
    <!-- Dark Donburi Bowl -->
    <path d="M30,105 C30,165 170,165 170,105 Z" fill="#2d3748"/>
    <ellipse cx="100" cy="105" rx="70" ry="18" fill="#1a202c"/>
    <ellipse cx="100" cy="104" rx="66" ry="15" fill="#e2e8f0"/>
    <!-- Fluffy Steamed White Rice -->
    <ellipse cx="100" cy="100" rx="64" ry="20" fill="#fffaf0"/>
    <!-- Golden Sliced Katsu Cutlet Fans Across -->
    <g transform="translate(10, 0)">
      <rect x="45" y="80" width="16" height="36" rx="4" fill="#d69e2e" stroke="#975a16" stroke-width="1.5"/>
      <rect x="63" y="76" width="16" height="40" rx="4" fill="#d69e2e" stroke="#975a16" stroke-width="1.5"/>
      <rect x="81" y="72" width="16" height="44" rx="4" fill="#ecc94b" stroke="#975a16" stroke-width="1.5"/>
      <rect x="99" y="74" width="16" height="42" rx="4" fill="#d69e2e" stroke="#975a16" stroke-width="1.5"/>
      <rect x="117" y="78" width="16" height="38" rx="4" fill="#d69e2e" stroke="#975a16" stroke-width="1.5"/>
    </g>
    <!-- Japanese Kewpie Mayo Drizzle (Fine lines) -->
    <path d="M50,85 Q100,70 150,85" stroke="#fff5ea" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M55,95 Q100,80 145,95" stroke="#fff5ea" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Sweet Tonkatsu Brown Sauce Drizzle -->
    <path d="M52,90 Q100,75 148,90" stroke="#4a2511" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Sweetcorn & Edamame side -->
    <circle cx="52" cy="108" r="4" fill="#ecc94b"/>
    <circle cx="60" cy="112" r="3.5" fill="#ecc94b"/>
    <circle cx="56" cy="116" r="3.5" fill="#ecc94b"/>
    <circle cx="140" cy="108" r="4" fill="#48bb78"/>
    <circle cx="148" cy="112" r="4" fill="#38a169"/>
    <!-- Spring Onions & Nori ribbons -->
    <rect x="92" y="65" width="4" height="12" rx="1" fill="#1a202c"/>
    <rect x="102" y="62" width="4" height="14" rx="1" fill="#1a202c"/>
    <circle cx="95" cy="78" r="2.5" fill="#38a169"/>
    <circle cx="105" cy="80" r="2.5" fill="#38a169"/>
  </g>
</svg>