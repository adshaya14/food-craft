<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadowMoj" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1d2a1f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadowMoj)">
    <ellipse cx="100" cy="182" rx="42" ry="10" fill="#e2d7bc" opacity="0.6"/>
    <!-- Highball Glass -->
    <path d="M72,60 L78,172 Q100,178 122,172 L128,60 Z" fill="#e2e8f0" opacity="0.4"/>
    <path d="M73,65 L79,170 Q100,175 121,170 L127,65 Z" fill="#e6fffa" opacity="0.75"/>
    <!-- Crushed Ice Cubes -->
    <rect x="82" y="135" width="16" height="16" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="102" y="142" width="15" height="15" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="88" y="115" width="18" height="18" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="96" y="90" width="16" height="16" rx="3" fill="#ffffff" opacity="0.7"/>
    <!-- Muddled Lime Wheel inside -->
    <circle cx="92" cy="120" r="14" fill="#38a169"/>
    <circle cx="92" cy="120" r="11" fill="#c6f6d5"/>
    <!-- Fresh Mint Leaves inside liquid -->
    <path d="M84,150 C76,140 92,135 96,146 C92,154 84,152 84,150 Z" fill="#22543d"/>
    <path d="M110,125 C118,115 102,110 98,121 C102,129 110,127 110,125 Z" fill="#276749"/>
    <!-- Sparkling Bubbles -->
    <circle cx="86" cy="100" r="2.5" fill="#ffffff"/>
    <circle cx="108" cy="110" r="2" fill="#ffffff"/>
    <circle cx="94" cy="80" r="3" fill="#ffffff"/>
    <circle cx="112" cy="75" r="2" fill="#ffffff"/>
    <!-- Fresh Mint Bouquet on rim -->
    <g transform="translate(76, 52) rotate(-25)">
      <path d="M0,0 C-14,-20 12,-26 18,0 C12,20 -14,16 0,0 Z" fill="#2f855a"/>
      <path d="M0,0 C-10,-15 8,-20 14,0" stroke="#68d391" stroke-width="2" fill="none"/>
    </g>
    <!-- Lime Wheel Garnish on Rim -->
    <g transform="translate(125, 60)">
      <circle cx="0" cy="0" r="16" fill="#2f855a"/>
      <circle cx="0" cy="0" r="13" fill="#9ae6b4"/>
      <circle cx="0" cy="0" r="12" fill="#38a169" stroke="#9ae6b4" stroke-width="1.5"/>
    </g>
    <!-- Glass Straw -->
    <line x1="110" y1="20" x2="88" y2="165" stroke="#bee3f8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>