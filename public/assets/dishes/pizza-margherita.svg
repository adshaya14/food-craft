<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadowP" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d2a1f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadowP)">
    <!-- Wooden Peel / Board under pizza -->
    <circle cx="100" cy="100" r="92" fill="#d69e2e" opacity="0.3"/>
    <!-- Charred Outer Crust -->
    <circle cx="100" cy="100" r="84" fill="#c05621"/>
    <circle cx="100" cy="100" r="82" fill="#dd6b20"/>
    <!-- Woodfire Char spots -->
    <ellipse cx="40" cy="75" rx="5" ry="3" fill="#2d1508" opacity="0.7"/>
    <ellipse cx="155" cy="68" rx="6" ry="3" fill="#2d1508" opacity="0.7"/>
    <ellipse cx="160" cy="130" rx="5" ry="3" fill="#2d1508" opacity="0.7"/>
    <ellipse cx="58" cy="145" rx="6" ry="4" fill="#2d1508" opacity="0.7"/>
    <ellipse cx="105" cy="22" rx="7" ry="3" fill="#2d1508" opacity="0.7"/>
    <ellipse cx="100" cy="178" rx="6" ry="3" fill="#2d1508" opacity="0.7"/>
    <!-- Tomato Rich Sauce -->
    <circle cx="100" cy="100" r="70" fill="#c53030"/>
    <!-- Melted Mozzarella Pool -->
    <path d="M50,100 Q65,65 100,55 Q140,65 150,100 Q145,135 100,148 Q55,138 50,100 Z" fill="#feebc8"/>
    <!-- Mozzarella Medallions -->
    <ellipse cx="80" cy="80" rx="18" ry="14" fill="#fffaf0"/>
    <ellipse cx="125" cy="82" rx="16" ry="13" fill="#fffaf0"/>
    <ellipse cx="100" cy="120" rx="20" ry="15" fill="#fffaf0"/>
    <ellipse cx="68" cy="115" rx="14" ry="12" fill="#fffaf0"/>
    <ellipse cx="132" cy="118" rx="15" ry="12" fill="#fffaf0"/>
    <!-- Extra Virgin Olive Oil Drizzle -->
    <path d="M65,75 Q100,105 135,70 Q105,130 90,140" stroke="#d69e2e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Fresh Basil Leaves -->
    <g transform="translate(76, 74) rotate(-20)">
      <path d="M0,0 C-10,-15 10,-20 12,0 C10,15 -10,10 0,0 Z" fill="#2f855a"/>
      <path d="M0,0 C-8,-12 8,-16 10,0" stroke="#68d391" stroke-width="1.5" fill="none"/>
    </g>
    <g transform="translate(122, 78) rotate(35)">
      <path d="M0,0 C-12,-16 8,-22 14,0 C8,16 -12,12 0,0 Z" fill="#276749"/>
      <path d="M0,0 C-10,-12 6,-18 12,0" stroke="#68d391" stroke-width="1.5" fill="none"/>
    </g>
    <g transform="translate(98, 114) rotate(10)">
      <path d="M0,0 C-14,-18 10,-24 16,0 C10,18 -14,14 0,0 Z" fill="#2f855a"/>
      <path d="M0,0 C-11,-14 8,-20 13,0" stroke="#68d391" stroke-width="1.5" fill="none"/>
    </g>
    <g transform="translate(68, 118) rotate(-55)">
      <path d="M0,0 C-10,-12 6,-18 10,0 C6,12 -10,10 0,0 Z" fill="#38a169"/>
    </g>
    <!-- Pepper Flecks -->
    <circle cx="85" cy="85" r="1.5" fill="#1a202c"/>
    <circle cx="120" cy="90" r="1.5" fill="#1a202c"/>
    <circle cx="95" cy="125" r="1.5" fill="#1a202c"/>
    <circle cx="108" cy="100" r="1.5" fill="#1a202c"/>
