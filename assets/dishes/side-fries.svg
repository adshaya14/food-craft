<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadowFri" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1d2a1f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadowFri)">
    <ellipse cx="100" cy="180" rx="65" ry="12" fill="#e2d7bc" opacity="0.6"/>
    <!-- Diner Style Red Basket / Carton -->
    <path d="M55,100 L68,170 Q100,178 132,170 L145,100 Z" fill="#c53030"/>
    <path d="M55,100 Q100,110 145,100 Q148,94 100,94 Q52,94 55,100 Z" fill="#9b2c2c"/>
    <!-- Checkered Paper Liner peaking out -->
    <polygon points="50,98 62,75 75,98" fill="#fffaf0"/>
    <polygon points="125,98 138,75 150,98" fill="#fffaf0"/>
    <!-- Golden Crispy Fries bursting out -->
    <g transform="rotate(-15 80 80)">
      <rect x="75" y="35" width="10" height="75" rx="3" fill="#ecc94b" stroke="#d69e2e" stroke-width="1.5"/>
    </g>
    <g transform="rotate(10 100 80)">
      <rect x="95" y="30" width="10" height="80" rx="3" fill="#faf089" stroke="#d69e2e" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-5 90 80)">
      <rect x="85" y="38" width="11" height="72" rx="3" fill="#ecc94b" stroke="#d69e2e" stroke-width="1.5"/>
    </g>
    <g transform="rotate(22 110 80)">
      <rect x="105" y="42" width="10" height="70" rx="3" fill="#ecc94b" stroke="#d69e2e" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-28 70 80)">
      <rect x="65" y="45" width="10" height="65" rx="3" fill="#faf089" stroke="#d69e2e" stroke-width="1.5"/>
    </g>
    <!-- Curly Fry loop -->
    <path d="M85,55 Q105,40 120,55 Q105,70 85,55" stroke="#d69e2e" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M85,55 Q105,40 120,55 Q105,70 85,55" stroke="#f6e05e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Melted Cheddar Cheese Drizzle -->
    <path d="M60,95 Q80,80 100,95 Q120,80 140,95 L138,105 Q120,95 100,105 Q80,95 62,105 Z" fill="#f6ad55"/>
    <!-- Red Peri Peri Seasoning Dust -->
    <circle cx="82" cy="50" r="1.5" fill="#e53e3e"/>
    <circle cx="102" cy="45" r="2" fill="#e53e3e"/>
    <circle cx="75" cy="65" r="1.5" fill="#e53e3e"/>
    <circle cx="112" cy="55" r="2" fill="#e53e3e"/>
    <circle cx="95" cy="70" r="1.5" fill="#e53e3e"/>
    <!-- Fresh Parsley flakes -->
    <circle cx="90" cy="58" r="2" fill="#2f855a"/>
    <circle cx="108" cy="62" r="1.5" fill="#2f855a"/>
  </g>
</svg>